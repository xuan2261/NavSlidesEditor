<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <style>
      * {
        box-sizing: border-box;
      }
      html,
      body {
        width: 100%;
        height: 100%;
        margin: 0;
        overflow: hidden;
        background: transparent;
        font-family: Inter, ui-sans-serif, system-ui, sans-serif;
      }
      .counter {
        width: 100%;
        height: 100%;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 8px;
        color: white;
      }
      .value {
        font-weight: 800;
        line-height: 1;
      }
      .label {
        font-size: 16px;
        opacity: 0.72;
      }
    </style>
  </head>
  <body>
    <div class="counter">
      <div class="value" id="value">0</div>
      <div class="label" id="label"></div>
    </div>
    <!-- COUNTER_SCRIPT -->
  </body>
</html>
