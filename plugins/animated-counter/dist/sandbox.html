<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <style>
      * { box-sizing: border-box; }
      html, body {
        width: 100%;
        height: 100%;
        margin: 0;
        overflow: hidden;
        background: transparent;
        font-family: Inter, ui-sans-serif, system-ui, sans-serif;
      }
      .counter {
        width: 100%;
        height: 100%;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 8px;
        color: white;
      }
      .value { font-weight: 800; line-height: 1; }
      .label { font-size: 16px; opacity: 0.72; }
    </style>
  </head>
  <body>
    <div class="counter">
      <div class="value" id="value">0</div>
      <div class="label" id="label"></div>
    </div>
    <script>
      let data = {};
      const valueEl = document.getElementById('value');
      const labelEl = document.getElementById('label');

      function render(nextData) {
        data = { ...data, ...nextData };
        const value = Number(data.value || 0);
        valueEl.textContent = `${data.prefix || ''}${value}${data.suffix || ''}`;
        valueEl.style.color = data.color || '#22c55e';
        valueEl.style.fontSize = `${Number(data.fontSize || 64)}px`;
        labelEl.textContent = data.label || '';
      }

      window.addEventListener('message', (event) => {
        const message = event.data || {};
        if (message.source !== 'navslides-host') return;
        if (message.type === 'init' || message.type === 'data-changed') render(message.pluginData || {});
      });

      window.navslides = window.navslides || {
        updateData(patch) {
          window.parent.postMessage({ source: 'navslides-plugin', type: 'update-data', patch }, '*');
        },
      };
      window.parent.postMessage({ source: 'navslides-plugin', type: 'ready' }, '*');
    </script>
  </body>
</html>
