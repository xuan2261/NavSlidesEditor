name: Reusable green SHA verification
on:
  workflow_call:
    inputs:
      subject_sha: { required: true, type: string }
      release_tag: { required: true, type: string }
      gate_policy_version: { required: true, type: string }
      linux_ci_run_id: { required: true, type: string }
      officecli_receipt_run_id: { required: true, type: string }
      fidelity_receipt_run_id: { required: true, type: string }
      officecli_receipt_artifact: { required: true, type: string }
      fidelity_receipt_artifact: { required: true, type: string }
    outputs:
      client_artifact: { value: '${{ jobs.client.outputs.artifact_name }}' }
      green_receipt_artifact: { value: '${{ jobs.create-root.outputs.artifact_name }}' }
      windows_artifact: { value: '${{ jobs.windows.outputs.windows_artifact }}' }
permissions: { contents: read, actions: read, id-token: write, attestations: write }
jobs:
  # CI is produced only by the canonical full CI workflow; release imports it.
  client:
    uses: ./.github/workflows/reusable-client-artifact.yml
    permissions: { contents: read, actions: read, id-token: write, attestations: write }
    with: { subject_sha: '${{ inputs.subject_sha }}', mode: release, source_run_id: '${{ inputs.linux_ci_run_id }}' }
  windows:
    needs: client
    uses: ./.github/workflows/reusable-windows-qualification.yml
    secrets: inherit
    with:
      subject_sha: ${{ inputs.subject_sha }}
      client_run_id: ${{ github.run_id }}
      linux_ci_run_id: ${{ inputs.linux_ci_run_id }}
      officecli_receipt_run_id: ${{ inputs.officecli_receipt_run_id }}
      fidelity_receipt_run_id: ${{ inputs.fidelity_receipt_run_id }}
      client_artifact: ${{ needs.client.outputs.artifact_name }}
      client_digest: ${{ needs.client.outputs.client_digest }}
      linux_receipt_artifact: linux-ci-receipt-v1-${{ inputs.subject_sha }}
      officecli_receipt_artifact: ${{ inputs.officecli_receipt_artifact }}
      fidelity_receipt_artifact: ${{ inputs.fidelity_receipt_artifact }}
      gate_policy_version: ${{ inputs.gate_policy_version }}
  create-root:
    needs: [client, windows]
    runs-on: ubuntu-latest
    permissions: { contents: read, actions: read }
    outputs: { artifact_name: '${{ steps.name.outputs.value }}' }
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with: { ref: '${{ inputs.subject_sha }}' }
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with: { node-version: '22.22.0' }
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        name: Import exact successful Linux CI receipt
        with: { name: 'linux-ci-receipt-v1-${{ inputs.subject_sha }}', run-id: '${{ inputs.linux_ci_run_id }}', github-token: '${{ github.token }}', path: receipts }
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with: { name: '${{ needs.windows.outputs.receipt_artifact }}', path: receipts }
      - id: name
        run: echo "value=green-sha-root-receipt-v1-${{ inputs.subject_sha }}" >> "$GITHUB_OUTPUT"
      - name: Create evidence-bound root and explicit not-selected receipts
        run: node scripts/ci/release-receipt-workflow.mjs create-root "${{ inputs.subject_sha }}" "${{ needs.client.outputs.client_digest }}" "${{ inputs.gate_policy_version }}" "${{ inputs.release_tag }}"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with: { name: '${{ steps.name.outputs.value }}', path: '*-receipt.json', if-no-files-found: error, retention-days: 30 }
