name: Reusable Playwright consumer

on:
  workflow_call:
    inputs:
      subject_sha: { required: true, type: string }
      client_artifact: { required: true, type: string }
      lane: { required: true, type: string }

permissions:
  contents: read
  actions: read

jobs:
  playwright:
    runs-on: ubuntu-latest
    container: { image: 'mcr.microsoft.com/playwright:v1.63.0-jammy' }
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with: { ref: '${{ inputs.subject_sha }}' }
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with: { node-version: '22.22.0', cache: npm }
      - run: npm ci
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with: { name: '${{ inputs.client_artifact }}', path: . }
      - run: node scripts/ci/verify-client-dist-manifest.mjs --root client/dist --manifest client-dist-manifest.json --subject "${{ inputs.subject_sha }}"
      - id: report
        shell: bash
        run: |
          case "${{ inputs.lane }}" in
            chromium-*) value="playwright-report-chromium-${{ inputs.lane }}";;
            pptx-import|live|mobile|visual) value="playwright-report-${{ inputs.lane }}";;
            *) exit 1;;
          esac
          echo "value=$value" >> "$GITHUB_OUTPUT"
      - name: Run production-byte Playwright lane
        shell: bash
        run: |
          case "${{ inputs.lane }}" in
            chromium-*) shard="${{ inputs.lane }}"; npx playwright test --project=chromium --shard="${shard#chromium-}/4" ;;
            pptx-import) npx playwright test --project=chromium-pptx-import --workers=1 ;;
            live) npx playwright test --project=chromium-live ;;
            mobile) npx playwright test tests/e2e/a11y/touch-gestures-tap-double-tap-and-swipe-on-tablet-viewport.spec.js --project=mobile-chromium ;;
            visual) npx playwright test tests/e2e/visual/ tests/e2e/visual-regression.spec.js --project=chromium-visual ;;
          esac
        env:
          CI: 'true'
          PLAYWRIGHT_CLIENT_PORT: '4173'
          PLAYWRIGHT_SERVER_PORT: '3202'
          PLAYWRIGHT_MOBILE_CHROMIUM: ${{ inputs.lane == 'mobile' && '1' || '' }}
      - if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ${{ steps.report.outputs.value }}
          path: playwright-report/
          retention-days: 14
