name: CI

on:
  push:
    branches: ['master', 'main']
  pull_request:
    branches: ['master', 'main']
  workflow_dispatch:
    inputs:
      subject_sha: { required: false, type: string, default: '' }

permissions:
  contents: read
  actions: read
  id-token: write
  attestations: write
env:
  NODE_VERSION: '22.23.3'
  PLAYWRIGHT_IMAGE: mcr.microsoft.com/playwright:v1.63.0-jammy

jobs:
  lint:
    name: Lint
    uses: ./.github/workflows/reusable-ci-quality.yml
    with:
      gate: lint
      subject_sha: ${{ inputs.subject_sha || github.sha }}

  unit-coverage:
    name: Unit + Coverage Gate
    uses: ./.github/workflows/reusable-ci-quality.yml
    with:
      gate: unit-coverage
      subject_sha: ${{ inputs.subject_sha || github.sha }}

  vitest-performance-budget:
    name: Vitest performance budget
    uses: ./.github/workflows/reusable-ci-quality.yml
    with:
      gate: vitest-budget
      subject_sha: ${{ inputs.subject_sha || github.sha }}

  build:
    name: Build client
    needs: [lint]
    uses: ./.github/workflows/reusable-client-artifact.yml
    permissions:
      contents: read
      actions: read
      id-token: write
      attestations: write
    with:
      subject_sha: ${{ inputs.subject_sha || github.sha }}
      mode: ci
      attest: ${{ github.event_name != 'pull_request' }}

  e2e-chromium:
    name: 'E2E chromium (shard ${{ matrix.shard }}/4)'
    needs: [build]
    strategy:
      fail-fast: false
      matrix: { shard: [1, 2, 3, 4] }
    uses: ./.github/workflows/reusable-playwright-consumer.yml
    with:
      subject_sha: ${{ inputs.subject_sha || github.sha }}
      client_artifact: ${{ needs.build.outputs.artifact_name }}
      lane: chromium-${{ matrix.shard }}

  e2e-pptx-import:
    name: E2E PPTX import (workers:1)
    needs: [build]
    uses: ./.github/workflows/reusable-playwright-consumer.yml
    with:
      {
        subject_sha: '${{ inputs.subject_sha || github.sha }}',
        client_artifact: '${{ needs.build.outputs.artifact_name }}',
        lane: pptx-import,
      }

  e2e-live:
    name: E2E live (workers:1)
    needs: [build]
    uses: ./.github/workflows/reusable-playwright-consumer.yml
    with:
      {
        subject_sha: '${{ inputs.subject_sha || github.sha }}',
        client_artifact: '${{ needs.build.outputs.artifact_name }}',
        lane: live,
      }

  e2e-mobile:
    name: E2E mobile-chromium (Phase 7 a11y)
    needs: [build]
    uses: ./.github/workflows/reusable-playwright-consumer.yml
    with:
      {
        subject_sha: '${{ inputs.subject_sha || github.sha }}',
        client_artifact: '${{ needs.build.outputs.artifact_name }}',
        lane: mobile,
      }

  e2e-visual:
    name: E2E visual regression (Linux baseline only)
    needs: [build]
    uses: ./.github/workflows/reusable-playwright-consumer.yml
    with:
      {
        subject_sha: '${{ inputs.subject_sha || github.sha }}',
        client_artifact: '${{ needs.build.outputs.artifact_name }}',
        lane: visual,
      }

  pptx-corpus-metrics:
    name: PPTX corpus metrics
    needs: [lint]
    uses: ./.github/workflows/reusable-ci-quality.yml
    with:
      gate: pptx-corpus
      subject_sha: ${{ inputs.subject_sha || github.sha }}

  load-smoke:
    name: k6 load smoke (api + ws)
    needs: [build]
    uses: ./.github/workflows/reusable-load-consumer.yml
    with:
      subject_sha: ${{ inputs.subject_sha || github.sha }}
      client_artifact: ${{ needs.build.outputs.artifact_name }}

  feature-coverage-gate:
    name: Feature coverage gate (warn-first, non-required)
    needs: [lint, build]
    uses: ./.github/workflows/reusable-ci-quality.yml
    with:
      gate: feature-coverage
      subject_sha: ${{ inputs.subject_sha || github.sha }}
      client_artifact: ${{ needs.build.outputs.artifact_name }}

  docker-artifact:
    name: Docker artifact qualification
    needs: [lint, build]
    uses: ./.github/workflows/reusable-docker-qualification.yml
    permissions:
      contents: read
      actions: read
      id-token: write
      attestations: write
    with:
      subject_sha: ${{ inputs.subject_sha || github.sha }}
      client_artifact: ${{ needs.build.outputs.artifact_name }}
      attest: ${{ github.event_name != 'pull_request' }}

  container-supply-chain:
    name: Container supply chain
    needs: [docker-artifact]
    uses: ./.github/workflows/reusable-container-supply-chain.yml
    with:
      subject_sha: ${{ inputs.subject_sha || github.sha }}
      source_run_id: ${{ github.run_id }}
      docker_artifact: docker-runtime-qualification

  required-checks:
    name: Required checks summary
    runs-on: ubuntu-latest
    permissions: { contents: read }
    needs:
      - lint
      - unit-coverage
      - vitest-performance-budget
      - build
      - e2e-chromium
      - e2e-pptx-import
      - e2e-live
      - e2e-mobile
      - e2e-visual
      - pptx-corpus-metrics
      - load-smoke
      - docker-artifact
      - container-supply-chain
    if: always()
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.subject_sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with: { node-version: '22.23.3' }
      - name: Require every mandatory job to succeed
        env:
          NEEDS_JSON: ${{ toJSON(needs) }}
        run: node scripts/ci/required-checks.mjs

  linux-ci-receipt:
    name: Linux CI qualification receipt
    if: github.event_name == 'push'
    needs: [build, required-checks]
    runs-on: ubuntu-latest
    permissions: { contents: read, actions: read }
    env: { GH_TOKEN: '${{ github.token }}' }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { ref: '${{ inputs.subject_sha || github.sha }}' }
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with: { node-version: '22.23.3' }
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with: { name: docker-runtime-qualification, path: evidence/docker }
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          {
            name: 'container-supply-chain-v1-${{ inputs.subject_sha || github.sha }}',
            path: evidence/supply-chain,
          }
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with: { name: '${{ needs.build.outputs.artifact_name }}', path: evidence/client }
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with: { pattern: 'playwright-report-*', path: evidence/reports }
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with: { name: coverage-html, path: evidence/reports/coverage-html }
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          {
            name: 'vitest-ci-budget-v1-${{ inputs.subject_sha || github.sha }}',
            path: 'evidence/reports/vitest-ci-budget-v1-${{ inputs.subject_sha || github.sha }}',
          }
      - name: Capture exact API run attempt jobs shards and artifacts
        run: node scripts/ci/release-receipt-workflow.mjs capture-run evidence "$GITHUB_RUN_ID" linux
      - name: Independently verify downloaded Docker provenance
        run: node scripts/ci/release-receipt-workflow.mjs capture-attestation evidence/docker/navslides-editor-image.tar "${{ inputs.subject_sha || github.sha }}" .github/workflows/reusable-docker-qualification.yml evidence/docker/docker-verified.json
      - run: node scripts/ci/release-receipt-workflow.mjs linux "${{ inputs.subject_sha || github.sha }}" "${{ needs.build.outputs.client_digest }}" release-target-policy-v4 evidence
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          {
            name: 'linux-ci-receipt-v1-${{ inputs.subject_sha || github.sha }}',
            path: linux-ci-receipt.json,
            if-no-files-found: error,
            retention-days: 30,
          }
