name: CI

on:
  push:
    branches: ['master', 'main']
  pull_request:
    branches: ['master', 'main']
  workflow_dispatch:
    inputs:
      subject_sha: { required: false, type: string, default: '' }

permissions:
  contents: read

env:
  NODE_VERSION: '22.22.0'
  PLAYWRIGHT_IMAGE: mcr.microsoft.com/playwright:v1.63.0-jammy

jobs:
  lint:
    name: Lint
    uses: ./.github/workflows/reusable-ci-quality.yml
    with:
      gate: lint
      subject_sha: ${{ inputs.subject_sha || github.sha }}

  unit-coverage:
    name: Unit + Coverage Gate
    uses: ./.github/workflows/reusable-ci-quality.yml
    with:
      gate: unit-coverage
      subject_sha: ${{ inputs.subject_sha || github.sha }}

  vitest-performance-budget:
    name: Vitest performance budget
    uses: ./.github/workflows/reusable-ci-quality.yml
    with:
      gate: vitest-budget
      subject_sha: ${{ inputs.subject_sha || github.sha }}

  build:
    name: Build client
    needs: [lint]
    uses: ./.github/workflows/reusable-client-artifact.yml
    permissions:
      contents: read
      actions: read
      id-token: write
      attestations: write
    with:
      subject_sha: ${{ inputs.subject_sha || github.sha }}
      mode: ci
      attest: ${{ github.event_name != 'pull_request' }}

  e2e-chromium:
    name: 'E2E chromium (shard ${{ matrix.shard }}/4)'
    needs: [build]
    strategy:
      fail-fast: false
      matrix: { shard: [1, 2, 3, 4] }
    uses: ./.github/workflows/reusable-playwright-consumer.yml
    with:
      subject_sha: ${{ inputs.subject_sha || github.sha }}
      client_artifact: ${{ needs.build.outputs.artifact_name }}
      lane: chromium-${{ matrix.shard }}

  e2e-pptx-import:
    name: E2E PPTX import (workers:1)
    needs: [build]
    uses: ./.github/workflows/reusable-playwright-consumer.yml
    with: { subject_sha: '${{ inputs.subject_sha || github.sha }}', client_artifact: '${{ needs.build.outputs.artifact_name }}', lane: pptx-import }

  e2e-live:
    name: E2E live (workers:1)
    needs: [build]
    uses: ./.github/workflows/reusable-playwright-consumer.yml
    with: { subject_sha: '${{ inputs.subject_sha || github.sha }}', client_artifact: '${{ needs.build.outputs.artifact_name }}', lane: live }

  e2e-mobile:
    name: E2E mobile-chromium (Phase 7 a11y)
    needs: [build]
    uses: ./.github/workflows/reusable-playwright-consumer.yml
    with: { subject_sha: '${{ inputs.subject_sha || github.sha }}', client_artifact: '${{ needs.build.outputs.artifact_name }}', lane: mobile }

  e2e-visual:
    name: E2E visual regression (Linux baseline only)
    needs: [build]
    uses: ./.github/workflows/reusable-playwright-consumer.yml
    with: { subject_sha: '${{ inputs.subject_sha || github.sha }}', client_artifact: '${{ needs.build.outputs.artifact_name }}', lane: visual }

  pptx-corpus-metrics:
    name: PPTX corpus metrics
    needs: [lint]
    uses: ./.github/workflows/reusable-ci-quality.yml
    with:
      gate: pptx-corpus
      subject_sha: ${{ inputs.subject_sha || github.sha }}

  load-smoke:
    name: k6 load smoke (api + ws)
    needs: [build]
    uses: ./.github/workflows/reusable-load-consumer.yml
    with:
      subject_sha: ${{ inputs.subject_sha || github.sha }}
      client_artifact: ${{ needs.build.outputs.artifact_name }}

  feature-coverage-gate:
    name: Feature coverage gate (warn-first, non-required)
    needs: [lint, build]
    uses: ./.github/workflows/reusable-ci-quality.yml
    with:
      gate: feature-coverage
      subject_sha: ${{ inputs.subject_sha || github.sha }}
      client_artifact: ${{ needs.build.outputs.artifact_name }}

  docker-artifact:
    name: Docker artifact qualification
    needs: [lint, build]
    uses: ./.github/workflows/reusable-docker-qualification.yml
    permissions:
      contents: read
      actions: read
      id-token: write
      attestations: write
    with:
      subject_sha: ${{ inputs.subject_sha || github.sha }}
      client_artifact: ${{ needs.build.outputs.artifact_name }}
      attest: ${{ github.event_name != 'pull_request' }}

  container-supply-chain:
    name: Container supply chain
    needs: [docker-artifact]
    uses: ./.github/workflows/reusable-container-supply-chain.yml
    with:
      subject_sha: ${{ inputs.subject_sha || github.sha }}
      source_run_id: ${{ github.run_id }}
      docker_artifact: docker-runtime-qualification

  required-checks:
    name: Required checks summary
    runs-on: ubuntu-latest
    needs:
      - lint
      - unit-coverage
      - vitest-performance-budget
      - build
      - e2e-chromium
      - e2e-pptx-import
      - e2e-live
      - e2e-mobile
      - e2e-visual
      - pptx-corpus-metrics
      - load-smoke
      - docker-artifact
      - container-supply-chain
    if: always()
    steps:
      - name: Fail if any required job failed
        run: |
          status='${{ join(needs.*.result, ',') }}'
          echo "results=$status"
          case "$status" in
            *failure*|*cancelled*|*timed_out*) exit 1 ;;
          esac

  linux-ci-receipt:
    name: Linux CI qualification receipt
    if: github.event_name == 'push'
    needs: [build, required-checks]
    runs-on: ubuntu-latest
    permissions: { contents: read, actions: read }
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with: { ref: '${{ inputs.subject_sha || github.sha }}' }
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with: { node-version: '22.22.0' }
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with: { name: docker-runtime-qualification, path: evidence/docker }
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with: { name: 'container-supply-chain-v1-${{ inputs.subject_sha || github.sha }}', path: evidence/supply-chain }
      - run: node scripts/ci/release-receipt-workflow.mjs linux "${{ inputs.subject_sha || github.sha }}" "${{ needs.build.outputs.client_digest }}" release-target-policy-v1 evidence
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with: { name: 'linux-ci-receipt-v1-${{ inputs.subject_sha || github.sha }}', path: linux-ci-receipt.json, if-no-files-found: error, retention-days: 30 }
