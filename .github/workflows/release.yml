name: Build & Release Electron

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: Existing v1.17.0 or v1.17.0-rc.N tag
        required: true
        type: string
      officecli_receipt_run_id:
        description: Approved exact-subject OfficeCLI physical producer run
        required: true
        type: string
      fidelity_receipt_run_id:
        description: Approved exact-subject Microsoft PowerPoint producer run
        required: true
        type: string

permissions:
  contents: write
  actions: read
  id-token: write
  attestations: write
concurrency:
  group: release-${{ github.event.inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  resolve:
    runs-on: ubuntu-latest
    permissions: { contents: read, actions: read }
    outputs:
      tag: ${{ steps.subject.outputs.tag }}
      subject_sha: ${{ steps.subject.outputs.sha }}
      linux_ci_run_id: ${{ steps.ci.outputs.run_id }}
      officecli_receipt_run_id: ${{ steps.ci.outputs.officecli_run_id }}
      fidelity_receipt_run_id: ${{ steps.ci.outputs.fidelity_run_id }}
      ci_head_sha: ${{ steps.ci.outputs.head_sha }}
      kind: ${{ steps.subject.outputs.kind }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with: { fetch-depth: 0 }
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with: { node-version: '22.22.0' }
      - id: subject
        shell: bash
        env:
          REQUESTED_TAG: ${{ github.event.inputs.tag || github.ref_name }}
        run: |
          set -euo pipefail
          TAG="$REQUESTED_TAG"
          git show-ref --verify --quiet "refs/tags/${TAG}"
          SHA="$(git rev-parse "${TAG}^{commit}")"
          git checkout --detach "$SHA"
          test "$(git rev-parse HEAD)" = "$SHA"
          node --input-type=module -e "import {parseReleaseTag} from './scripts/ci/release-subject.mjs';import p from './package.json' with {type:'json'};const r=parseReleaseTag(process.argv[1],p.version);if(!r)process.exit(1);console.log('kind='+r.kind)" "$TAG" >> "$GITHUB_OUTPUT"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "sha=$SHA" >> "$GITHUB_OUTPUT"
      - id: ci
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          SUBJECT_SHA: ${{ steps.subject.outputs.sha }}
          OFFICECLI_RUN: ${{ inputs.officecli_receipt_run_id || vars.OFFICECLI_RECEIPT_RUN_ID }}
          FIDELITY_RUN: ${{ inputs.fidelity_receipt_run_id || vars.FIDELITY_RECEIPT_RUN_ID }}
        run: |
          set -euo pipefail
          BASE="$(gh repo view "${{ github.repository }}" --json defaultBranchRef --jq '.defaultBranchRef.name')"
          test -n "$BASE"
          RUN="$(gh api -X GET "repos/${{ github.repository }}/actions/workflows/github-actions-ci-pipeline-lint-unit-coverage-e2e-load-smoke.yml/runs" -f head_sha="$SUBJECT_SHA" -f branch="$BASE" -f event=push -f status=success -f per_page=100 --jq '.workflow_runs[0] | [.id,.head_sha,.conclusion,.head_branch,.event,.path] | @tsv')"
          IFS=$'\t' read -r RUN_ID CI_HEAD CONCLUSION CI_BRANCH CI_EVENT CI_WORKFLOW <<< "$RUN"
          # Nonfinal && operands bypass errexit; each admission guard must stand alone.
          test -n "$RUN_ID"
          test "$CI_HEAD" = "$SUBJECT_SHA"
          test "$CONCLUSION" = success
          test "$CI_BRANCH" = "$BASE"
          test "$CI_EVENT" = push
          test "$CI_WORKFLOW" = .github/workflows/github-actions-ci-pipeline-lint-unit-coverage-e2e-load-smoke.yml
          [[ "$OFFICECLI_RUN" =~ ^[1-9][0-9]*$ && "$FIDELITY_RUN" =~ ^[1-9][0-9]*$ ]]
          test "$OFFICECLI_RUN" != "$RUN_ID"
          test "$FIDELITY_RUN" != "$RUN_ID"
          test "$OFFICECLI_RUN" != "$FIDELITY_RUN"
          echo "run_id=$RUN_ID" >> "$GITHUB_OUTPUT"
          echo "head_sha=$CI_HEAD" >> "$GITHUB_OUTPUT"
          echo "officecli_run_id=$OFFICECLI_RUN" >> "$GITHUB_OUTPUT"
          echo "fidelity_run_id=$FIDELITY_RUN" >> "$GITHUB_OUTPUT"

  verification:
    needs: [resolve, container-supply-chain]
    uses: ./.github/workflows/reusable-green-sha-verification.yml
    secrets: inherit
    permissions:
      contents: read
      actions: read
      id-token: write
      attestations: write
    with:
      subject_sha: ${{ needs.resolve.outputs.subject_sha }}
      release_tag: ${{ needs.resolve.outputs.tag }}
      gate_policy_version: release-target-policy-v1
      linux_ci_run_id: ${{ needs.resolve.outputs.linux_ci_run_id }}
      officecli_receipt_run_id: ${{ needs.resolve.outputs.officecli_receipt_run_id }}
      fidelity_receipt_run_id: ${{ needs.resolve.outputs.fidelity_receipt_run_id }}
      officecli_receipt_artifact: officecli-physical-receipt-v1-${{ needs.resolve.outputs.subject_sha }}
      fidelity_receipt_artifact: powerpoint-fidelity-receipt-v1-${{ needs.resolve.outputs.subject_sha }}

  container-supply-chain:
    needs: resolve
    uses: ./.github/workflows/reusable-container-supply-chain.yml
    with:
      subject_sha: ${{ needs.resolve.outputs.subject_sha }}
      source_run_id: ${{ needs.resolve.outputs.linux_ci_run_id }}
      docker_artifact: docker-runtime-qualification

  verify-staged-assets:
    needs: [resolve, verification]
    runs-on: windows-latest
    permissions: { contents: read, actions: read, attestations: read }
    outputs:
      staged_artifact: ${{ steps.name.outputs.value }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ needs.resolve.outputs.subject_sha }}
          fetch-depth: 0
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with: { name: '${{ needs.verification.outputs.client_artifact }}', path: client-evidence }
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with: { name: '${{ needs.verification.outputs.windows_artifact }}', path: post-download }
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with: { name: '${{ needs.verification.outputs.green_receipt_artifact }}', path: root-evidence }
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with: { node-version: '22.22.0' }
      - name: Verify subject DAG manifest and independently downloaded signed bytes
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          WINDOWS_SIGNING_SUBJECT: ${{ vars.WINDOWS_SIGNING_SUBJECT }}
          WINDOWS_SIGNING_THUMBPRINT: ${{ vars.WINDOWS_SIGNING_THUMBPRINT }}
          WINDOWS_VERIFIER_PATH: ${{ vars.WINDOWS_VERIFIER_PATH }}
          WINDOWS_VERIFIER_SHA256: ${{ vars.WINDOWS_VERIFIER_SHA256 }}
          WINDOWS_VERIFIER_VERSION: ${{ vars.WINDOWS_VERIFIER_VERSION }}
          WINDOWS_SIGNTOOL_PATH: ${{ vars.WINDOWS_SIGNTOOL_PATH }}
          WINDOWS_SIGNTOOL_SHA256: ${{ vars.WINDOWS_SIGNTOOL_SHA256 }}
        run: |
          node scripts/ci/release-receipt-workflow.mjs verify-staged "${{ needs.resolve.outputs.subject_sha }}" "${{ needs.resolve.outputs.tag }}" "${{ needs.resolve.outputs.ci_head_sha }}"
          if ($LASTEXITCODE -ne 0) { throw 'staged release verification failed; release assets not admitted' }
      - id: name
        shell: pwsh
        run: '"value=staged-release-v1-${{ needs.resolve.outputs.subject_sha }}" >> $env:GITHUB_OUTPUT'
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ${{ steps.name.outputs.value }}
          path: |
            post-download/*.exe
            root-evidence/green-sha-root-receipt.json
          if-no-files-found: error
          retention-days: 30

  stage-draft:
    needs: [resolve, verification, verify-staged-assets]
    runs-on: ubuntu-latest
    environment: release-staging
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with: { name: '${{ needs.verify-staged-assets.outputs.staged_artifact }}', path: release-assets }
      - name: Draft existing-tag release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          tag_name: ${{ needs.resolve.outputs.tag }}
          target_commitish: ${{ needs.resolve.outputs.subject_sha }}
          draft: true
          prerelease: ${{ needs.resolve.outputs.kind == 'rc' }}
          generate_release_notes: true
          files: release-assets/post-download/*.exe

  publish-final:
    if: needs.resolve.outputs.kind == 'final'
    needs: [resolve, verification, verify-staged-assets, stage-draft]
    runs-on: ubuntu-latest
    environment: release-publication
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with: { name: '${{ needs.verify-staged-assets.outputs.staged_artifact }}', path: release-assets }
      - name: Publish verified final assets
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          tag_name: ${{ needs.resolve.outputs.tag }}
          target_commitish: ${{ needs.resolve.outputs.subject_sha }}
          draft: false
          prerelease: false
          files: release-assets/post-download/*.exe
