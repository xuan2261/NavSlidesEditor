name: Build & Release Docker

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: Existing v1.17.0 or v1.17.0-rc.N tag
        required: true
        type: string

permissions:
  contents: write
  actions: read
  id-token: write
  attestations: write
concurrency:
  group: release-${{ github.event.inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  resolve:
    runs-on: ubuntu-latest
    permissions: { contents: read, actions: read }
    outputs:
      tag: ${{ steps.subject.outputs.tag }}
      subject_sha: ${{ steps.subject.outputs.sha }}
      source_run_id: ${{ steps.ci.outputs.run_id }}
      ci_head_sha: ${{ steps.ci.outputs.head_sha }}
      kind: ${{ steps.subject.outputs.kind }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with: { fetch-depth: 0 }
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with: { node-version: '22.22.0' }
      - id: subject
        shell: bash
        env:
          REQUESTED_TAG: ${{ github.event.inputs.tag || github.ref_name }}
        run: |
          set -euo pipefail
          TAG="$REQUESTED_TAG"
          git show-ref --verify --quiet "refs/tags/${TAG}"
          SHA="$(git rev-parse "${TAG}^{commit}")"
          git checkout --detach "$SHA"
          test "$(git rev-parse HEAD)" = "$SHA"
          node --input-type=module -e "import {parseReleaseTag} from './scripts/ci/release-subject.mjs';import p from './package.json' with {type:'json'};const r=parseReleaseTag(process.argv[1],p.version);if(!r)process.exit(1);console.log('kind='+r.kind)" "$TAG" >> "$GITHUB_OUTPUT"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "sha=$SHA" >> "$GITHUB_OUTPUT"
      - id: ci
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          SUBJECT_SHA: ${{ steps.subject.outputs.sha }}
        run: |
          RUN="$(gh api "repos/${{ github.repository }}/actions/workflows/github-actions-ci-pipeline-lint-unit-coverage-e2e-load-smoke.yml/runs?head_sha=${SUBJECT_SHA}&event=push&status=success&per_page=100" --jq '[.workflow_runs[] | select(.head_branch == "master" or .head_branch == "main")][0] | [.id,.head_sha,.conclusion] | @tsv')"
          IFS=$'\t' read -r RUN_ID CI_HEAD CONCLUSION <<< "$RUN"
          test -n "$RUN_ID" && test "$CI_HEAD" = "$SUBJECT_SHA" && test "$CONCLUSION" = success
          echo "run_id=$RUN_ID" >> "$GITHUB_OUTPUT"
          echo "head_sha=$CI_HEAD" >> "$GITHUB_OUTPUT"

  verification:
    needs: resolve
    uses: ./.github/workflows/reusable-green-sha-verification.yml
    permissions:
      contents: read
      actions: read
      id-token: write
      attestations: write
    with:
      subject_sha: ${{ needs.resolve.outputs.subject_sha }}
      mode: release
      release_tag: ${{ needs.resolve.outputs.tag }}
      gate_policy_version: release-target-policy-v3
      source_run_id: ${{ needs.resolve.outputs.source_run_id }}
      officecli_receipt_artifact: officecli-physical-receipt-v1-${{ needs.resolve.outputs.subject_sha }}

  verify-staged-assets:
    needs: [resolve, verification]
    runs-on: ubuntu-latest
    permissions: { contents: read, actions: read, attestations: read }
    outputs:
      staged_artifact: ${{ steps.name.outputs.value }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with: { ref: '${{ needs.resolve.outputs.subject_sha }}' }
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with: { node-version: '22.22.0' }
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with: { name: '${{ needs.verification.outputs.client_artifact }}', path: client-source }
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          { name: '${{ needs.verification.outputs.green_receipt_artifact }}', path: root-evidence }
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: docker-runtime-qualification
          run-id: '${{ needs.resolve.outputs.source_run_id }}'
          github-token: '${{ github.token }}'
          path: docker-source
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: 'container-supply-chain-v1-${{ needs.resolve.outputs.subject_sha }}'
          run-id: '${{ needs.resolve.outputs.source_run_id }}'
          github-token: '${{ github.token }}'
          path: scan-evidence
      - name: Verify promoted source and container identity
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          SUBJECT_SHA: ${{ needs.resolve.outputs.subject_sha }}
          CI_HEAD_SHA: ${{ needs.resolve.outputs.ci_head_sha }}
          RELEASE_TAG: ${{ needs.resolve.outputs.tag }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$SUBJECT_SHA"
          export GITHUB_SHA_CHECKOUT="$(git rev-parse HEAD)"
          node scripts/ci/verify-client-dist-manifest.mjs --root client-source/client/dist --manifest client-source/client-dist-manifest.json --subject "$SUBJECT_SHA"
          gh attestation verify docker-source/navslides-editor-image.tar --repo "${{ github.repository }}" --signer-workflow "${{ github.repository }}/.github/workflows/reusable-docker-qualification.yml" --format json > docker-source/docker-attestation-verification.json
          docker load --input docker-source/navslides-editor-image.tar
          test "$(docker image inspect navslides-editor:ci --format '{{.Id}}')" = "$(tr -d '\r\n' < docker-source/docker-image-digest.txt)"
          node scripts/ci/verify-release-promotion.mjs "$SUBJECT_SHA" "$CI_HEAD_SHA" "$RELEASE_TAG" root-evidence/green-sha-root-receipt.json client-source/client-dist-manifest.json docker-source/docker-image-digest.txt scan-evidence/container-supply-chain-receipt.json scan-evidence/container-trivy.json scan-evidence/container-sbom.spdx.json
      - id: name
        run: echo "value=release-staged-docker-v1-${{ needs.resolve.outputs.subject_sha }}" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ${{ steps.name.outputs.value }}
          path: |
            docker-source/navslides-editor-image.tar
            docker-source/docker-image-digest.txt
            docker-source/docker-attestation-verification.json
            root-evidence/green-sha-root-receipt.json
            scan-evidence/container-trivy.json
            scan-evidence/container-sbom.spdx.json
            scan-evidence/container-supply-chain-receipt.json
          if-no-files-found: error
          retention-days: 30

  stage-draft:
    needs: [resolve, verification, verify-staged-assets]
    runs-on: ubuntu-latest
    environment: release-staging
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          {
            name: '${{ needs.verify-staged-assets.outputs.staged_artifact }}',
            path: release-assets,
          }
      - name: Draft existing-tag release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          tag_name: ${{ needs.resolve.outputs.tag }}
          target_commitish: ${{ needs.resolve.outputs.subject_sha }}
          draft: true
          prerelease: ${{ needs.resolve.outputs.kind == 'rc' }}
          generate_release_notes: true
          body: |
            **Container security advisory:** This private single-user self-hosted release accepts unresolved HIGH/CRITICAL Trivy findings as user-approved risk; it is not a security pass. Inspect `container-trivy.json`, `container-sbom.spdx.json`, and `container-supply-chain-receipt.json` before deployment.
            Windows runtime closure and OfficeCLI qualification are private evidence only. PowerPoint fidelity is unqualified. No Windows executable is published.
          files: |
            release-assets/docker-source/navslides-editor-image.tar
            release-assets/docker-source/docker-image-digest.txt
            release-assets/docker-source/docker-attestation-verification.json
            release-assets/root-evidence/green-sha-root-receipt.json
            release-assets/scan-evidence/container-trivy.json
            release-assets/scan-evidence/container-sbom.spdx.json
            release-assets/scan-evidence/container-supply-chain-receipt.json
          fail_on_unmatched_files: true

  publish-final:
    if: needs.resolve.outputs.kind == 'final'
    needs: [resolve, verification, verify-staged-assets, stage-draft]
    runs-on: ubuntu-latest
    environment: release-publication
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          {
            name: '${{ needs.verify-staged-assets.outputs.staged_artifact }}',
            path: release-assets,
          }
      - name: Publish verified final assets
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          tag_name: ${{ needs.resolve.outputs.tag }}
          target_commitish: ${{ needs.resolve.outputs.subject_sha }}
          draft: false
          prerelease: false
          body: |
            **Container security advisory:** This private single-user self-hosted release accepts unresolved HIGH/CRITICAL Trivy findings as user-approved risk; it is not a security pass. Inspect `container-trivy.json`, `container-sbom.spdx.json`, and `container-supply-chain-receipt.json` before deployment.
            Windows runtime closure and OfficeCLI qualification are private evidence only. PowerPoint fidelity is unqualified. No Windows executable is published.
          files: |
            release-assets/docker-source/navslides-editor-image.tar
            release-assets/docker-source/docker-image-digest.txt
            release-assets/docker-source/docker-attestation-verification.json
            release-assets/root-evidence/green-sha-root-receipt.json
            release-assets/scan-evidence/container-trivy.json
            release-assets/scan-evidence/container-sbom.spdx.json
            release-assets/scan-evidence/container-supply-chain-receipt.json
          fail_on_unmatched_files: true
