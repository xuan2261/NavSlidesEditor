name: Electron server lock refresh

# Regenerates electron/server-package-lock.json via `npm run electron:lock` on a
# weekly cadence. Dependabot manages the workspace lockfile at root, but the
# isolated lock the Electron packaging flow consumes is generated — this job
# keeps it in sync with in-range server dependency updates.

on:
  schedule:
    - cron: '30 6 * * 1'
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  refresh:
    name: Regenerate isolated Electron server lock
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with: { node-version: '22.22.0' }
      - run: npm run electron:lock
      - name: Open PR when the lock moved
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          if ! git status --porcelain electron/server-package-lock.json | grep -q .; then
            echo "Electron server lock already up to date."
            exit 0
          fi
          branch="chore/electron-server-lock-refresh-${{ github.run_id }}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -b "$branch"
          git add electron/server-package-lock.json
          git commit -m "chore: refresh isolated Electron server lock"
          git push origin "$branch"
          gh pr create \
            --title "chore: refresh isolated Electron server lock" \
            --body "Regenerates electron/server-package-lock.json via \`npm run electron:lock\` so the packaged Electron server picks up in-range dependency updates that Dependabot lands on the workspace lockfile." \
            --base master \
            --head "$branch"
