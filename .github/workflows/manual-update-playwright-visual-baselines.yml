name: Manual Update Playwright Visual Baselines

on:
  workflow_dispatch:

permissions:
  contents: read

env:
  NODE_VERSION: '22.23.3'
  CI: 'true'
  PLAYWRIGHT_CLIENT_PORT: '4173'
  PLAYWRIGHT_SERVER_PORT: '3202'

jobs:
  update-visual-baselines:
    name: Update visual baselines in Linux container
    runs-on: ubuntu-latest
    timeout-minutes: 25
    container:
      image: mcr.microsoft.com/playwright:v1.63.0-jammy
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Trust checkout for build metadata
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22.23.3'
          cache: npm

      - run: npm ci

      - run: npm run build

      - name: Update visual baselines
        run: >
          npx playwright test
          tests/e2e/visual/
          tests/e2e/visual-regression.spec.js
          --update-snapshots

      - name: Verify regenerated visual baselines
        run: >
          npx playwright test
          tests/e2e/visual/
          tests/e2e/visual-regression.spec.js

      - name: Upload Linux visual baseline snapshots
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: linux-playwright-visual-baseline-snapshots
          path: |
            tests/e2e/visual/**/*-snapshots/*.png
            tests/e2e/visual-regression.spec.js-snapshots/*.png
          if-no-files-found: error
          retention-days: 14

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-report-manual-visual-baselines
          path: playwright-report/
          if-no-files-found: ignore
          retention-days: 14
